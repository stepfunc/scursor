name: CI

on:
  push:
    branches: [main]
    # a version tag publishes the release; see RELEASING.md
    tags: ["*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy
      - run: cargo test
      # catch packaging problems on PRs instead of at release time
      - run: cargo publish --dry-run

  no-panic:
    name: no-panic link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --profile no-panic --features no-panic --test no_panic
      # the check is only meaningful if it still detects a known panic
      - name: canary must fail to link
        run: |
          log=$(mktemp)
          if cargo test --profile no-panic --features no-panic --test no_panic_canary > "$log" 2>&1; then
            echo "::error::the no_panic canary linked, so the check is no longer detecting panics"
            exit 1
          fi
          if ! grep -q 'detected panic in function `canary`' "$log"; then
            cat "$log"
            echo "::error::the no_panic canary failed for an unexpected reason"
            exit 1
          fi

  msrv:
    name: MSRV (1.77)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.77
      # build only: dev-dependencies require a newer toolchain
      - run: cargo build

  # Runs only for tags, after every check above passes. See RELEASING.md.
  release:
    needs: [test, no-panic, msrv]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft GitHub release
      id-token: write # crates.io trusted publishing
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to check that the tag is on main
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag against Cargo.toml, CHANGELOG.md, and main
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::tag $VERSION does not match the Cargo.toml version $manifest"
            exit 1
          fi
          if ! grep -qxF "### $VERSION ###" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '### $VERSION ###' section"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $VERSION is not on main"
            exit 1
          fi
      # each step below skips work that is already done, so rerunning a failed release is safe
      - name: Check whether this version is already on crates.io
        id: crates
        run: |
          if curl -fs -A "scursor-release (https://github.com/stepfunc/scursor)" \
              "https://crates.io/api/v1/crates/scursor/$VERSION" > /dev/null; then
            echo "scursor $VERSION is already on crates.io, skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.crates.outputs.published != 'true'
        id: auth
      - name: Publish to crates.io
        if: steps.crates.outputs.published != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "release $VERSION already exists, skipping"
            exit 0
          fi
          # release notes are this version's CHANGELOG.md section
          awk -v heading="### $VERSION ###" '$0 == heading {found = 1; next} /^### / && found {exit} found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --draft --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
