[package]
name = "scursor"
version = "0.5.0"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77"
description = "Secure cursor library with support for read and write transactions"
repository = "https://github.com/stepfunc/scursor"
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
missing_docs = "deny"
warnings = "deny"
unused = { level = "deny", priority = -1 }
missing_copy_implementations = "deny"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

[dependencies]
no-panic = { version = "0.1", optional = true }

[dev-dependencies]
proptest = "1"

[features]
# CI-only: fails to link if any public routine can panic. Requires an optimized
# build (see the `no-panic` profile); debug builds will report false positives.
no-panic = ["dep:no-panic"]

[[test]]
name = "no_panic"
required-features = ["no-panic"]

[profile.no-panic]
inherits = "release"
overflow-checks = true
